<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Vault</title>
<style>
:root{--bg:#f1f3f8;--side:#e6e9f2;--card:#fff;--ink:#161b2c;--mute:#6a7389;--line:#d9deea;--tg:#1f98d6;--dr:#2f9e6e;--bad:#d4403f;--warn:#e0782b}
@media(prefers-color-scheme:dark){:root{--bg:#0d111a;--side:#121723;--card:#171d2b;--ink:#e9edf8;--mute:#8b95ac;--line:#252c3d;--tg:#4cb8f0;--dr:#4cc790}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,'Segoe UI',sans-serif}
nav{width:200px;background:var(--side);padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.logo{font:700 20px Georgia,serif;padding:4px 10px 14px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mute)}nav button.on{background:var(--card);color:var(--ink);font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tg);outline-offset:2px}
.st{margin-top:auto;font-size:12px;color:var(--mute);padding:10px;display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}.dot.ok{background:var(--dr)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}.top h1{font-size:20px;margin:0;margin-right:auto}
.btn{background:var(--tg);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}.btn.g{background:var(--dr)}.btn.o{background:none;color:var(--mute);border:1px solid var(--line)}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
#v{flex:1;overflow:auto;padding:22px 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.num{font:600 28px Georgia,serif}.mute{color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:980px){.cols{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 12px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mute);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line)}
a,.lnk{color:var(--tg);cursor:pointer;text-decoration:none}.x{color:var(--mute);cursor:pointer}.x:hover{color:var(--bad)}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line)}.tag.channel{color:var(--tg)}.tag.drive{color:var(--dr)}
.form{display:flex;gap:8px;margin-top:12px}.form input{flex:1;min-width:0}label{display:block;margin:12px 0 4px;color:var(--mute)}.empty{color:var(--mute);padding:12px 0}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;max-width:380px}
.chip{display:inline-block;padding:3px 12px;margin:0 6px 6px 0;border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--mute)}.chip.on{background:var(--tg);border-color:var(--tg);color:#fff}td select{max-width:120px;padding:3px 6px}
</style></head><body>
<nav><div class="logo">Vault</div><button data-p="home">Overview</button><button data-p="files">Files</button><button data-p="stor">Storage</button><button data-p="set">Settings</button>
<div class="st"><span class="dot" id="dot"></span><span id="bs">Bot offline</span></div></nav>
<section><div class="top"><h1 id="t"></h1><span id="busy" class="mute"></span><select id="dest" aria-label="Upload destination"></select><button class="btn" id="up">Upload files</button></div><div id="v"></div></section><div id="toast"></div>
<script>
const T=window.__TAURI__,inv=(c,a)=>T.core.invoke(c,a||{});
window.api={state:()=>inv('state'),saveCfg:c=>inv('save_cfg',{c}),addChannel:r=>inv('add_channel',{r}),removeChannel:id=>inv('remove_channel',{id}),
 addDrive:email=>inv('add_drive',{email}),removeDrive:email=>inv('remove_drive',{email}),upload:o=>inv('upload',{o}),removeFile:id=>inv('remove_file',{id}),
 download:id=>inv('download',{id}),move:o=>inv('move_file',{o}),addFolder:name=>inv('add_folder',{name}),openLink:url=>inv('open_link',{url}),
 onChange:f=>T.event.listen('changed',()=>f()),onBusy:f=>T.event.listen('busy',e=>f(e.payload))};
T.event.listen('drop',e=>window.postMessage({drop:e.payload},'*'));
</script>
<script>
let S={accounts:[],channels:[],files:[],log:[],cfg:{},folders:['General']},page='home',cur='All';const $=id=>document.getElementById(id);
const sz=b=>b>=1e12?(b/1e12).toFixed(2)+' TB':b>=1e9?(b/1e9).toFixed(1)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':(b/1e3|0)+' KB';
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?(s/60|0)+' min ago':s<86400?(s/3600|0)+' h ago':(s/86400|0)+' d ago'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=String(m.message||m).replace(/^Error invoking remote method '.*?': (Error: )?/,'');t.style.display='block';setTimeout(()=>t.style.display='none',4500)};
const run=async f=>{try{await f()}catch(e){toast(e)}};
const inFolder=()=>S.files.filter(f=>cur==='All'||f.folder===cur);
const rows=F=>F.length?F.map(f=>`<tr><td>${f.id}</td><td>${f.link?`<a class="lnk" data-l="${esc(f.link)}">${esc(f.name)}</a>`:esc(f.name)}</td><td>${sz(f.size)}</td><td><select data-mv="${f.id}" aria-label="Folder">${S.folders.map(o=>`<option ${o===f.folder?'selected':''}>${esc(o)}</option>`).join('')}</select></td><td><span class="tag ${f.kind}">${esc(f.where)}</span></td><td>${ago(f.at)}</td><td><span class="lnk" data-dl="${f.id}">Download</span> · <span class="x" data-rf="${f.id}">Delete</span></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No files here yet. Drag files in, or send them to your bot.</td></tr>';
const head='<table><thead><tr><th>#</th><th>Name</th><th>Size</th><th>Folder</th><th>Stored in</th><th>When</th><th></th></tr></thead><tbody>';
const feed=()=>S.log.length?S.log.slice(0,12).map(l=>`<div class="item">${esc(l.m)}<div class="mute">${ago(l.at)}</div></div>`).join(''):'<div class="empty">Nothing yet.</div>';
const views={
 home(){const u=S.accounts.reduce((s,a)=>s+a.usage,0),cb=S.channels.reduce((s,c)=>s+c.bytes,0);
  return `<div class="tiles"><div class="card"><div class="mute">Files</div><div class="num">${S.files.length}</div></div>
  <div class="card"><div class="mute">Telegram channels</div><div class="num">${S.channels.length}</div><div class="mute">${sz(cb)} stored</div></div>
  <div class="card"><div class="mute">Google accounts</div><div class="num">${S.accounts.length}</div><div class="mute">${sz(u)} used</div></div></div>
  <div class="cols"><div class="card"><h2>Recent files</h2>${head}${rows(S.files.slice(0,6))}</tbody></table></div><div class="card"><h2>Activity</h2>${feed()}</div></div>`},
 files(){return `<div class="card"><div class="row" style="margin-bottom:12px;flex-wrap:wrap"><div>${['All',...S.folders].map(f=>`<span class="chip ${f===cur?'on':''}" data-f="${esc(f)}">${esc(f)}</span>`).join('')}</div><div class="form" style="margin:0"><input id="nf" placeholder="New folder"><button class="btn o" id="addf">Add</button></div></div><input id="q" placeholder="Search files" style="width:100%;margin-bottom:10px">${head}${rows(inFolder())}</tbody></table><div class="empty">Drag files onto this window to upload them to ${esc(cur==='All'?'General':cur)}.</div></div>`},
 stor(){return `<div class="cols"><div class="card"><h2>Telegram channels</h2>
  ${S.channels.map(c=>`<div class="item"><div class="row"><b>${esc(c.title)}</b><span class="x" data-rc="${c.id}">Remove</span></div><div class="mute">${c.files} files · ${sz(c.bytes)} · no storage limit</div></div>`).join('')||'<div class="empty">No channels yet. Make the bot an admin of a channel, then add it here.</div>'}
  <div class="form"><input id="ch" placeholder="@channelname or -100123…"><button class="btn" id="addch">Add channel</button></div></div>
  <div class="card"><h2>Google Drives</h2>
  ${S.accounts.map(a=>{const p=a.limit?a.usage/a.limit*100:0;return `<div class="item"><div class="row"><b>${esc(a.email)}</b><span class="x" data-rd="${esc(a.email)}">Remove</span></div>
  ${a.ok?`<div class="bar"><i style="width:${p}%;background:${p>90?'var(--bad)':p>75?'var(--warn)':'var(--dr)'}"></i></div><div class="mute">${sz(a.usage)} of ${a.limit?sz(a.limit):'unlimited'} · ${a.files} files</div>`:'<div class="mute" style="color:var(--bad)">Access expired. Connect this email again.</div>'}</div>`}).join('')||'<div class="empty">No Google accounts yet. Enter an email to sign in and grant access.</div>'}
  <div class="form"><input id="em" type="email" placeholder="name@gmail.com"><button class="btn g" id="adddr">Connect</button></div></div></div>`},
 set(){return `<div class="card" style="max-width:560px"><h2>Connections</h2>
  <label>Telegram bot token ${S.cfg.token?'(saved)':''}</label><input id="s1" type="password" style="width:100%" placeholder="from @BotFather">
  <label>Google client ID ${S.cfg.google?'(saved)':''}</label><input id="s2" style="width:100%" placeholder="Desktop app OAuth client">
  <label>Google client secret</label><input id="s3" type="password" style="width:100%">
  <div class="form"><button class="btn" id="sv">Save</button><button class="btn o" id="ro">${S.cfg.owner?'Unlock bot owner':'Bot not locked yet. Send /start to it'}</button></div></div>`}};
const names={home:'Overview',files:'Files',stor:'Storage',set:'Settings'};
function draw(force){
 if(!force&&/INPUT|SELECT/.test(document.activeElement.tagName)&&document.activeElement.id!=='dest')return;
 $('t').textContent=names[page];$('v').innerHTML=views[page]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
 $('dot').className='dot'+(S.bot?' ok':'');$('bs').textContent=S.bot?'@'+S.bot:'Bot offline';
 const d=$('dest'),cur=d.value;d.innerHTML='<option value="auto">Auto choose</option>'+S.channels.map(c=>`<option value="ch:${c.id}">Channel: ${esc(c.title)}</option>`).join('')+S.accounts.map(a=>`<option value="dr:${esc(a.email)}">Drive: ${esc(a.email)}</option>`).join('');d.value=cur||'auto';
 const q=$('q');if(q)q.oninput=()=>{const k=q.value.toLowerCase();document.querySelector('tbody').innerHTML=rows(inFolder().filter(f=>(f.name+f.where+f.from).toLowerCase().includes(k)))};
}
async function load(f){S=await api.state();draw(f)}
document.addEventListener('click',e=>{const d=e.target.dataset,id=e.target.id;
 if(d.p){page=d.p;draw(true)}
 if(d.l)api.openLink(d.l);
 if(d.dl)run(()=>api.download(+d.dl));
 if(d.f){cur=d.f;draw(true)}
 if(id==='addf')run(async()=>{await api.addFolder($('nf').value.trim());await load(true)});
 if(d.rf&&confirm('Delete this file from its storage?'))run(()=>api.removeFile(+d.rf).then(()=>load(true)));
 if(d.rc)run(()=>api.removeChannel(+d.rc).then(()=>load(true)));
 if(d.rd&&confirm('Remove access to '+d.rd+'? Files stay in that Drive.'))run(()=>api.removeDrive(d.rd).then(()=>load(true)));
 if(id==='addch')run(async()=>{await api.addChannel($('ch').value.trim());await load(true)});
 if(id==='adddr')run(async()=>{toast('Finish signing in in your browser…');await api.addDrive($('em').value.trim());await load(true);toast('Connected')});
 if(id==='sv')run(async()=>{await api.saveCfg({token:$('s1').value.trim(),gid:$('s2').value.trim(),gsecret:$('s3').value.trim()});toast('Saved');load(true)});
 if(id==='ro')run(()=>api.saveCfg({resetOwner:true}).then(()=>load(true)));
 if(id==='up')run(()=>api.upload({dest:$('dest').value,folder:cur==='All'?'General':cur}));
});
document.addEventListener('change',e=>{if(e.target.dataset.mv)run(()=>api.move({id:+e.target.dataset.mv,folder:e.target.value}).then(()=>load(true)))});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('message',e=>{if(e.source===window&&e.data&&e.data.drop)run(()=>api.upload({dest:$('dest').value,folder:cur==='All'?'General':cur,paths:e.data.drop}))});
api.onBusy(t=>$('busy').textContent=t);api.onChange(()=>load());load(true);setInterval(()=>load(),15000);
</script></body></html>
